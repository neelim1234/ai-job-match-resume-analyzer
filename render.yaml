services:
  # ── Backend API ────────────────────────────────────────────────────────────
  - type: web
    name: ai-job-match-backend
    runtime: python
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: ai-job-match-db
          property: connectionString
      - key: SECRET_KEY
        generateValue: true
      - key: ACCESS_TOKEN_EXPIRE_MINUTES
        value: 1440
      - key: GEMINI_API_KEY
        sync: false          # You set this manually in Render dashboard
      - key: FRONTEND_URL
        sync: false          # You set this after Vercel deploy
      - key: UPLOAD_DIR
        value: uploads/resumes
      - key: MAX_FILE_SIZE_MB
        value: 10

  # ── PostgreSQL Database ────────────────────────────────────────────────────
databases:
  - name: ai-job-match-db
    databaseName: job_matcher
    user: job_matcher_user
